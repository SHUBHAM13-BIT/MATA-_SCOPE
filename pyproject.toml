[project]
name = "meta-scope"
version = "0.1.0"
description = "Advanced metadata analyzer and digital forensics application"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
